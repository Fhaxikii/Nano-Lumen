  <rect x="450" y="296" width="200" height="150" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="550" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">存储与记忆层</text>
  <text x="550" y="356" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">memory/</text>
  <text x="550" y="380" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/context</text>
  <text x="550" y="404" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/rag</text>
