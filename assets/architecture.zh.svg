  <text x="170" y="356" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/provider</text>
  <text x="170" y="380" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/models</text>

  <rect x="260" y="296" width="200" height="150" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="360" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">工具与能力层</text>
  <text x="360" y="356" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/tools</text>
  <text x="360" y="380" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/os_layer</text>
  <text x="360" y="404" text-anchor="middle" font-size="13" fill="#3f3f46" font-family="ui-monospace,Consolas,monospace">core/mcp_client</text>
